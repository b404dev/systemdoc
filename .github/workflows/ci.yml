name: CI
on:
  push:
    branches: ['**']
  pull_request:
permissions:
  contents: read
jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: make check
      - run: make test
      - name: Read-only launchd smoke test
        if: runner.os == 'macOS'
        run: SYSTEMDOC_LIVE_LAUNCHD=1 go test ./internal/dashboard -run '^TestLiveLaunchdReadOnly$' -count=1
      - run: make cross
