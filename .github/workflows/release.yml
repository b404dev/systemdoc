name: Release
on:
  push:
    tags: ['v[0-9]*']
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: make check && make test
      - name: Build static binaries and checksums
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: sh scripts/release.sh "$RELEASE_VERSION"
      - name: Create draft release for review
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ github.ref_name }}
        run: >-
          gh release create "$RELEASE_VERSION"
          dist/systemdoc-linux-amd64 dist/systemdoc-linux-arm64
          dist/systemdoc-darwin-arm64 dist/SHA256SUMS
          --verify-tag --draft --title "Systemdoc $RELEASE_VERSION" --generate-notes
