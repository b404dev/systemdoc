name: systemdoc-playground

x-defaults: &defaults
  restart: "no"
  cpus: 0.25
  mem_limit: 96m
  logging:
    driver: json-file
    options:
      max-size: "2m"
      max-file: "2"

services:
  web:
    <<: *defaults
    image: nginx:alpine
    ports:
      - "127.0.0.1::80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  redis:
    <<: *defaults
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    tmpfs:
      - /data:size=32m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  worker:
    <<: *defaults
    image: alpine:3
    mem_limit: 32m
    init: true
    command:
      - /bin/sh
      - -c
      - |
        trap 'echo "INFO worker stopping"; exit 0' TERM INT
        count=0
        while :; do
          count=$$((count + 1))
          echo "INFO heartbeat=$$count worker running"
          if [ $$((count % 10)) -eq 0 ]; then
            echo "WARNING playground log-colour sample; no action required"
          fi
          sleep 3 & wait $$!
        done

  prometheus:
    <<: *defaults
    image: prom/prometheus:v2.53.1
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=2h

  node-exporter:
    <<: *defaults
    image: quay.io/prometheus/node-exporter:v1.8.2
    pid: host
    volumes:
      - /:/host:ro,rslave
    command:
      - --path.rootfs=/host

  cadvisor:
    <<: *defaults
    image: ghcr.io/google/cadvisor:v0.52.1
    mem_limit: 160m
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
