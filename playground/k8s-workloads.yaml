# Sample workloads for exploring Systemdoc's Kubernetes support. Every state the
# Containers suite distinguishes is represented: healthy, not ready, crash loop,
# image pull failure and a completed Job.
apiVersion: v1
kind: Namespace
metadata:
  name: shop
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: web-config
  namespace: shop
data:
  index.html: |
    <h1>Systemdoc k0s playground</h1>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: shop
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 96Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
          livenessProbe:
            httpGet:
              path: /
              port: http
          volumeMounts:
            - name: content
              mountPath: /usr/share/nginx/html
              readOnly: true
      volumes:
        - name: content
          configMap:
            name: web-config
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: shop
spec:
  type: NodePort
  selector:
    app: web
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: shop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: busybox:1.36
          command: ["sh", "-c", "while true; do echo \"$(date -Is) api heartbeat\"; sleep 5; done"]
        - name: sidecar
          image: busybox:1.36
          command: ["sh", "-c", "sleep 1d"]
          # This probe never passes, so the pod stays Running but not ready.
          readinessProbe:
            exec:
              command: ["test", "-f", "/never-created"]
            periodSeconds: 10
---
apiVersion: v1
kind: Pod
metadata:
  name: crashy
  namespace: shop
  labels:
    app: crashy
spec:
  restartPolicy: Always
  containers:
    - name: crashy
      image: busybox:1.36
      command: ["sh", "-c", "echo 'boom: simulated crash'; exit 1"]
---
apiVersion: v1
kind: Pod
metadata:
  name: nopull
  namespace: shop
spec:
  containers:
    - name: nopull
      image: ghcr.io/systemdoc-playground/does-not-exist:1
---
apiVersion: batch/v1
kind: Job
metadata:
  name: migrate
  namespace: shop
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: busybox:1.36
          command: ["sh", "-c", "echo migrating; sleep 2; echo done"]
---
# Runs on every node; a single-node stack shows one pod.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-agent
  namespace: shop
spec:
  selector:
    matchLabels:
      app: node-agent
  template:
    metadata:
      labels:
        app: node-agent
    spec:
      containers:
        - name: agent
          image: busybox:1.36
          command: ["sh", "-c", "while true; do echo \"$(date -Is) agent tick\"; sleep 15; done"]
---
# The claim names a StorageClass that does not exist, so the pod stays
# Pending with an unbound claim: the storage-side failure shape.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: cache
  namespace: shop
spec:
  serviceName: cache
  replicas: 1
  selector:
    matchLabels:
      app: cache
  template:
    metadata:
      labels:
        app: cache
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: fast-ssd
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: cache
  namespace: shop
spec:
  clusterIP: None
  selector:
    app: cache
  ports:
    - port: 6379
---
# Allocates past its memory limit and is OOM-killed on every start.
apiVersion: v1
kind: Pod
metadata:
  name: oomy
  namespace: shop
spec:
  restartPolicy: Always
  containers:
    - name: hog
      image: busybox:1.36
      command: ["sh", "-c", "head -c 300m /dev/zero | tail"]
      resources:
        limits:
          memory: 32Mi
---
# Requests more CPU than the node has, so the scheduler never places it.
apiVersion: v1
kind: Pod
metadata:
  name: greedy
  namespace: shop
spec:
  containers:
    - name: greedy
      image: busybox:1.36
      command: ["sleep", "1d"]
      resources:
        requests:
          cpu: "64"
---
# Healthy process, failing liveness probe: the kubelet restarts it repeatedly.
apiVersion: v1
kind: Pod
metadata:
  name: flappy
  namespace: shop
spec:
  containers:
    - name: flappy
      image: busybox:1.36
      command: ["sleep", "1d"]
      livenessProbe:
        exec:
          command: ["false"]
        periodSeconds: 5
        failureThreshold: 2
